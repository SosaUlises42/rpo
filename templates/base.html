<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trabajos Escolares</title>

    <link      
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    />
</head>

<body class="bg-light">

    <div class="position-relative text-center">
        <img src="https://static.vecteezy.com/system/resources/previews/025/871/386/original/blue-medical-health-abstract-background-with-plus-sign-template-design-with-concept-and-idea-for-healthcare-technology-innovation-medicine-health-science-and-research-vector.jpg"
            class="w-100">
        <div class="position-absolute top-0 start-0 w-100 h-100 overflow-y-auto">

            <header>
                <nav class="navbar fixed-top px-3" style="background-color: #6C91A6;">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                        <img
                            src="https://cdn-icons-png.flaticon.com/512/906/906334.png"
                            width="35"
                            height="35"
                        >
                        <span class="fw-bold fs-5 text-light">
                            Proyecto PAEC
                        </span>
                    </a>
                </nav>
            </header>

            <main class="my-5">
                {% block contenido %}
                {% endblock %}
            </main>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        </div>
    </div>

</body>
</html>
